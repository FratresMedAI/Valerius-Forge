name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  content-gate:
    name: Content gate smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: valerius-cli/package-lock.json
      - name: Build CLI (gate module)
        working-directory: valerius-cli
        run: |
          npm ci
          npm run build
      - name: Run gate smoke test
        run: node scripts/gate-test.mjs
